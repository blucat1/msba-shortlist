name: Application checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: application-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run quality:check
      - run: npm run test:db:smoke
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  supabase-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Exercise actual Supabase/PostgreSQL authorization in a disposable stack.
      # Local password sessions only; NEVER config push this transient Auth copy.
      - run: node scripts/prepare-local-integration.mjs
      - run: npx --yes supabase start
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - if: always()
        run: npx --yes supabase stop --no-backup
      - if: always()
        run: node scripts/prepare-local-integration.mjs --restore
