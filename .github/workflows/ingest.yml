name: Public employer feed import
on:
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional exact registry source ID; leave blank to refresh all feeds'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: catalog-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    # First scheduled attempts stay automatic. Only the owner may dispatch or
    # rerun production work; reruns retain the original actor, so also check the
    # triggering actor. The environment independently permits only branch main.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'schedule' && github.run_attempt == 1) ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'blucat1' && github.triggering_actor == 'blucat1') ||
       (github.run_attempt > 1 && github.triggering_actor == 'blucat1'))
    environment: production-ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned official actions; review upstream updates deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Import complete approved snapshots
        run: |
          if [ -n "$INGEST_SOURCE" ]; then
            npm run ingest -- --source "$INGEST_SOURCE"
          else
            npm run ingest
          fi
        env:
          INGEST_SOURCE: ${{ inputs.source }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - run: npm run maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
